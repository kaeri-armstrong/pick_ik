version: '3.8'
services:
  devcontainer:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    container_name: dev-armstrong_pick_ik
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=99
    extra_hosts:
      - armstrong_pick_ik:127.0.0.1
    hostname: armstrong_pick_ik
    image: armstrong_pick_ik:latest
    network_mode: host
    privileged: true
    user: dev
    volumes:
      - ../:/home/dev/armstrong_pick_ik
      - ~/.ssh:/home/dev/.ssh:ro
      - ~/.gitconfig:/home/dev/.gitconfig:ro
      - ~/.local/.armstrong_pick_ik/ccache:/home/dev/.ccache
      - ~/.local/.armstrong_pick_ik/log:/home/dev/.ros/log
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${SSH_AUTH_SOCK}:${SSH_AUTH_SOCK}
    working_dir: /home/armstrong_pick_ik
